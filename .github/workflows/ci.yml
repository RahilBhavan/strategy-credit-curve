name: Offline verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13.15'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/restore_data.py
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q credit_curve scripts tests
      - run: python scripts/render_results.py
      - run: git diff --exit-code -- results figures/scenarios.svg README.md
